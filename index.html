<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taze Mola | Gelir Gider</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f4;color:#202721;font:15px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px 16px 100px}header{display:flex;align-items:center;gap:12px;margin-bottom:28px}header span{background:#203e30;color:white;border-radius:16px;padding:14px;font-size:24px}h1,h2,p{margin:0}small{color:#737b75}h1{font-size:24px}h2{font-size:19px;margin-bottom:16px}.panel{background:white;border:1px solid #e3e7e3;border-radius:20px;padding:20px;margin-bottom:16px}.tabs,.actions,.totals{display:flex;gap:8px}.tabs button{flex:1;padding:12px 4px;background:#eef1ed;color:#333}.tabs button.active{background:#203e30;color:white}button{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:650;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #91b8a1}.summary{background:#203e30;color:white;margin-top:16px;padding:22px;border-radius:16px}.summary small{color:#d2dfd5}.big{font-size:clamp(26px,6vw,40px);font-weight:750;margin:8px 0 20px;overflow-wrap:anywhere}.totals>div{flex:1;min-width:0;border-top:1px solid #ffffff35;padding-top:12px}.totals strong{display:block;font-size:clamp(16px,3.5vw,23px);overflow-wrap:anywhere}.actions button{flex:1;color:white;margin:16px 0}.income{background:#237b4b}.expense{background:#b83d3d}.green{color:#237b4b}.red{color:#b83d3d}.entry{display:flex;align-items:center;gap:10px;padding:15px 0;border-bottom:1px solid #eee}.entry:last-child{border:0}.entry .desc{flex:1;min-width:0;overflow-wrap:anywhere}.entry small{display:block;margin-top:4px}.entry button{padding:8px;background:#f1f3f0;font-size:12px}.entry strong{white-space:nowrap}.empty{text-align:center;padding:30px;color:#737b75}label{display:block;margin:14px 0 6px;font-weight:600}input{width:100%;border:1px solid #d7ded7;border-radius:10px;padding:12px;font:inherit;background:white}dialog{border:0;border-radius:22px;padding:24px;width:min(92vw,440px);box-shadow:0 20px 80px #0003}dialog::backdrop{background:#0006}.save{background:#203e30;color:white;width:100%;margin-top:20px}.cancel{width:100%;margin-top:8px;background:#eef1ed}.periodnav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:8px}.periodnav button{background:#eef1ed;padding:8px 14px}.bar{height:12px;background:#edf0ed;border-radius:10px;overflow:hidden;margin:8px 0 16px}.bar div{height:100%;border-radius:10px}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e3e7e3;display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:8px}nav button{background:white;color:#737b75;flex:1;max-width:250px}nav button.active{background:#e8efe9;color:#203e30}[hidden]{display:none!important}.notice{font-size:12px;color:#737b75;margin-top:16px;line-height:1.5}@media(max-width:450px){.entry{flex-wrap:wrap}.entry .desc{flex-basis:50%}.entry strong{margin-left:auto}.panel{padding:15px}}
</style></head><body><main><header><div><h1>Taze Mola</h1><small>Gelir & Gider Yönetimi</small></div></header><section id="overview" class="panel"><div class="tabs" id="tabs"></div><div class="periodnav"><button id="prev" aria-label="Önceki dönem">‹</button><strong id="periodLabel"></strong><button id="next" aria-label="Sonraki dönem">›</button></div><div class="summary"><small>Gelir − Gider</small><div class="big" id="balance"></div><div class="totals"><div><small>Toplam gelir</small><strong id="income"></strong></div><div><small>Toplam gider</small><strong id="expense"></strong></div></div></div><div id="chart" hidden style="margin-top:22px"><h2>Gelir ve gider karşılaştırması</h2><div>Gelir <strong id="ci"></strong></div><div class="bar"><div id="bi" class="income"></div></div><div>Gider <strong id="ce"></strong></div><div class="bar"><div id="be" class="expense"></div></div><small id="count"></small></div></section><div class="actions" id="actions"><button class="income" id="addIncome">+ Gelir ekle</button><button class="expense" id="addExpense">− Gider ekle</button></div><section class="panel" id="history"><h2 id="historyTitle">Son işlemler</h2><div id="entries"></div></section></main><nav id="nav"><button data-page="home" class="active">Ana sayfa</button><button data-page="history">İşlemler</button><button data-page="stats">İstatistikler</button></nav><dialog id="dialog"><form id="form"><h2 id="formTitle"></h2><label for="amount">Tutar (TL)</label><input id="amount" type="number" min="0.01" max="999999999" step="0.01" inputmode="decimal" required><label for="note">Açıklama</label><input id="note" maxlength="200" required placeholder="Örn. Günlük satış"><label for="date">Tarih</label><input id="date" type="date" required><button class="save" type="submit">Kaydet</button><button class="cancel" type="button" id="cancel">Vazgeç</button></form></dialog><script>
const $=id=>document.getElementById(id), key='tazemola-ledger-v1', money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY'}).format(n/100);let records=[];try{records=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(records))throw Error()}catch(e){alert('Kayıtlar okunamadı.');records=[]}let period=0,anchor=new Date(),page='home',kind='income',editing=null;const names=['Günlük','Haftalık','Aylık','Yıllık'];function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function bounds(){let a=new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate()),b;if(period===1)a.setDate(a.getDate()-(a.getDay()+6)%7);if(period===2)a.setDate(1);if(period===3)a=new Date(a.getFullYear(),0,1);b=new Date(a);if(period===0)b.setDate(b.getDate()+1);if(period===1)b.setDate(b.getDate()+7);if(period===2)b.setMonth(b.getMonth()+1);if(period===3)b.setFullYear(b.getFullYear()+1);return[a,b]}function move(n){let[a]=bounds();if(period<2)a.setDate(a.getDate()+n*(period===0?1:7));else if(period===2)a.setMonth(a.getMonth()+n);else a.setFullYear(a.getFullYear()+n);anchor=a;render()}function persist(next){try{localStorage.setItem(key,JSON.stringify(next));records=next;return true}catch(e){alert('Kayıt saklanamadı. Tarayıcı depolamasını kontrol edin.');return false}}function render(){let[a,b]=bounds(),end=new Date(b);end.setDate(end.getDate()-1);let fmt=d=>d.toLocaleDateString('tr-TR');$('periodLabel').textContent=period===0?fmt(a):period===1?fmt(a)+' – '+fmt(end):period===2?a.toLocaleDateString('tr-TR',{month:'long',year:'numeric'}):String(a.getFullYear());let filtered=records.filter(r=>r.date>=iso(a)&&r.date<iso(b)),i=0,e=0;filtered.forEach(r=>r.kind==='income'?i+=r.cents:e+=r.cents);$('income').textContent=money(i);$('expense').textContent=money(e);$('balance').textContent=money(i-e);$('ci').textContent=money(i);$('ce').textContent=money(e);$('bi').style.width=100*i/Math.max(i,e,1)+'%';$('be').style.width=100*e/Math.max(i,e,1)+'%';$('count').textContent=filtered.length+' işlem';$('tabs').replaceChildren(...names.map((n,j)=>{let t=document.createElement('button');t.textContent=n;t.className=j===period?'active':'';t.onclick=()=>{period=j;anchor=new Date();render()};return t}));$('overview').hidden=page==='history';$('chart').hidden=page!=='stats';$('history').hidden=page==='stats';$('actions').hidden=page==='stats';$('historyTitle').textContent=page==='history'?'Tüm işlemler':'Son işlemler';let list=(page==='history'?records:filtered).slice().sort((x,y)=>y.date.localeCompare(x.date)||y.created-x.created);$('entries').replaceChildren();if(!list.length){let p=document.createElement('p');p.className='empty';p.textContent='Henüz kayıt yok.';$('entries').append(p)}list.forEach(r=>{let row=document.createElement('div');row.className='entry';let desc=document.createElement('div');desc.className='desc';let name=document.createElement('b');name.textContent=r.note;let date=document.createElement('small');date.textContent=r.date.split('-').reverse().join('.')+' · '+(r.kind==='income'?'Gelir':'Gider');desc.append(name,date);let val=document.createElement('strong');val.className=r.kind==='income'?'green':'red';val.textContent=(r.kind==='income'?'+':'−')+money(r.cents);let edit=document.createElement('button');edit.textContent='Düzenle';edit.onclick=()=>openForm(r.kind,r);let del=document.createElement('button');del.textContent='Sil';del.onclick=()=>{if(confirm('Bu kayıt silinsin mi?')&&persist(records.filter(x=>x.id!==r.id)))render()};row.append(desc,val,edit,del);$('entries').append(row)});document.querySelectorAll('nav button').forEach(t=>t.classList.toggle('active',t.dataset.page===page))}function openForm(k,r=null){kind=k;editing=r;$('formTitle').textContent=(r?'Kaydı düzenle':k==='income'?'Gelir ekle':'Gider ekle');$('amount').value=r?r.cents/100:'';$('note').value=r?r.note:'';$('date').value=r?r.date:iso(new Date());$('dialog').showModal()}$('form').onsubmit=ev=>{ev.preventDefault();let cents=Math.round(Number($('amount').value)*100),note=$('note').value.trim(),date=$('date').value;if(!Number.isSafeInteger(cents)||cents<=0||!note||!date)return;let r={id:editing?editing.id:(globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random()),created:editing?editing.created:Date.now(),kind,cents,note,date};if(persist(editing?records.map(x=>x.id===editing.id?r:x):[...records,r])){$('dialog').close();anchor=new Date(date+'T12:00:00');render()}};$('cancel').onclick=()=>$('dialog').close();$('addIncome').onclick=()=>openForm('income');$('addExpense').onclick=()=>openForm('expense');$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);document.querySelectorAll('nav button').forEach(t=>t.onclick=()=>{page=t.dataset.page;render()});render();
</script></body></html>
